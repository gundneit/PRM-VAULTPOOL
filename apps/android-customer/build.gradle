plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

// Backend URL: emulator default 10.0.2.2; máy thật set trong root local.properties → BACKEND_BASE_URL
def localProps = new Properties()
def lpFile = rootProject.file("local.properties")
if (lpFile.exists()) {
    lpFile.withInputStream { localProps.load(it) }
}
def backendBaseUrl = localProps.getProperty("BACKEND_BASE_URL", "http://10.0.2.2:8080/")
if (!backendBaseUrl.endsWith("/")) {
    backendBaseUrl += "/"
}

android {
    namespace "com.vaultpool.customer"
    compileSdk 34

    defaultConfig {
        applicationId "com.vaultpool.customer"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "BACKEND_BASE_URL", "\"${backendBaseUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    // Project Modules
    implementation project(":libraries:common-models")

    // Splash Screen API
    implementation "androidx.core:core-splashscreen:1.0.1"

    // AndroidX Core
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime:2.7.0"

    // Navigation
    implementation "androidx.navigation:navigation-fragment:2.7.7"
    implementation "androidx.navigation:navigation-ui:2.7.7"
    implementation "androidx.viewpager2:viewpager2:1.1.0"

    // Networking
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:adapter-rxjava3:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    implementation "com.google.code.gson:gson:2.10.1"

    // Glide for Image Loading
    implementation "com.github.bumptech.glide:glide:4.16.0"

    // Firebase
    implementation platform("com.google.firebase:firebase-bom:32.7.2")
    implementation "com.google.firebase:firebase-auth-ktx"

    // RxJava
    implementation "io.reactivex.rxjava3:rxjava:3.1.8"
    implementation "io.reactivex.rxjava3:rxandroid:3.0.2"

    // QR Scanner
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"

    // Security
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Images
    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"

    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"

    // ZaloPay ZPDK — dùng flatDir (settings.gradle) để AGP luôn đưa AAR vào compile classpath
    implementation(name: "zpdk-release-v3.1", ext: "aar")
}
